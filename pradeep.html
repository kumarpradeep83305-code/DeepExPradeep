<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A4350"><title>DeepEx एडमिन पैनल</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--d:#0A4350;--t:#0B6B7A;--g:#E0A52B;--bg:#EAF8F5;--l:#D5EEEA}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--d);font:500 16px/1.45 'Baloo 2',system-ui,sans-serif}
header{background:var(--d);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header svg{width:40px;height:40px;background:#fff;border-radius:10px;padding:5px}
header b{font-size:1.2rem;margin-right:auto}
header button{background:transparent;color:#fff;border:2px solid transparent;border-radius:20px;padding:4px 14px;font:inherit;font-weight:700;cursor:pointer}
header button.on{background:var(--t)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0;font-size:1.25rem}
.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.st{background:#fff;border-radius:20px;padding:18px;text-align:center}.st h1{margin:0;font-size:2.2rem}.st p{margin:0}
.r{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--l)}.r>div:not(.a){flex:1 1 180px;min-width:0;overflow-wrap:anywhere;word-break:break-word}.r>.a{flex:1 1 100%;justify-content:flex-start}
.a{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
button,input,select,textarea{font:inherit}
.a button,.b{border:2px solid var(--t);background:#fff;color:var(--d);border-radius:14px;padding:4px 14px;cursor:pointer;font-weight:700}
.b{background:var(--t);color:#fff}.b.o{background:#fff;color:var(--d)}.b.big{width:100%;min-height:48px;margin-top:10px}.b.sm{padding:0 12px;font-size:.85rem}
.a .x{border-color:#B3261E;color:#B3261E}
input,select,textarea{width:100%;min-height:44px;border:2px solid var(--l);border-radius:12px;padding:6px 12px;margin:4px 0;background:#fff;color:var(--d)}
input[type=checkbox]{width:22px;min-height:22px;margin:0}
label{display:block;font-weight:700;margin-top:8px}.ck{display:flex;gap:8px;align-items:center}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.bc a{color:var(--t);cursor:pointer;text-decoration:underline}
.m{opacity:.75}small{opacity:.8}
.th{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--l);display:grid;place-items:center;font-size:24px}.r .th+div{flex:1;min-width:0}.r>div:first-child{flex:1;min-width:0}
.pvw{display:block;width:96px;height:96px;object-fit:cover;border-radius:14px;margin:6px 0 10px;background:var(--l)}
audio{width:100%;margin:4px 0 8px}
.tg2{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px;align-items:center}.tg2 .ck{margin:0;font-size:.92rem;font-weight:700}
dialog{border:0;border-radius:22px;padding:20px;width:min(94vw,520px);max-height:90vh}dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:var(--d);color:#fff;padding:12px 22px;border-radius:20px;z-index:99}
.lg{max-width:380px;margin:60px auto}
a.l{color:var(--t);cursor:pointer;text-decoration:underline}
</style></head><body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),A=$('#app'),K='dx_db';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SB_URL='https://ghxgrfchjokmycmrfngo.supabase.co',SB_KEY='sb_publishable_wxnpEwZAxyPL65PqFKXH4w_7RIFpafx';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let db={cats:[],books:[],eps:[],users:[],ud:{},plays:{},cfg:{}};
const sv=()=>{};
const TB={cats:'categories',books:'audiobooks',eps:'episodes'};
const ck=r=>{if(r&&r.error)throw Error(r.error.message);return r&&r.data};
const mut=async f=>{try{ck(await f());return true}catch(x){toast(x.message||'Error');return false}};
async function loadAll(){
 const q=t=>sb.from(t).select('*').range(0,9999);
 const [c,b,e,u,f,p,pi,h,pp,g,au]=await Promise.all([q('categories'),q('audiobooks'),q('episodes'),q('profiles'),q('favorites'),q('playlists'),q('playlist_items'),q('listening_history'),q('episode_plays'),q('app_config'),sb.auth.getUser()]);
 db.cats=ck(c);db.books=ck(b);db.eps=ck(e);
 const prof=ck(u),adm=prof.filter(x=>x.role=='admin').map(x=>x.id);
 db.users=prof.filter(x=>x.role!='admin');
 const em={};prof.forEach(x=>em[x.id]=x.email);
 db.ud={};db.users.forEach(x=>db.ud[x.email]={fav:[],pl:[],hist:[]});
 ck(f).forEach(x=>{const d=db.ud[em[x.user_id]];if(d)d.fav.push(x.kind+x.ref_id)});
 const pls=ck(p),its=ck(pi);
 pls.forEach(x=>{const d=db.ud[em[x.user_id]];if(d)d.pl.push({id:x.id,name:x.name,items:its.filter(i=>i.playlist_id==x.id).map(i=>i.episode_id)})});
 ck(h).forEach(x=>{const d=db.ud[em[x.user_id]];if(d)d.hist.push({b:x.audiobook_id,e:x.episode_id,p:x.position_seconds,d:x.duration_seconds,t:new Date(x.updated_at).getTime()})});
 db.plays={};ck(pp).forEach(x=>db.plays[x.episode_id]=Number(x.plays));
 db.cfg={admin:{email:(au.data.user||{}).email||''}};ck(g).forEach(x=>db.cfg[x.key]=x.value);
}
const url=s=>{try{return /^https?:$/.test(new URL(s).protocol)}catch{return false}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)};
const modal=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()},closeM=()=>$('#dlg').close();
$('#dlg').onclose=()=>{if(db.cfg.admin)show(tab)};
const form=(id,fn)=>{$(id).onsubmit=async e=>{e.preventDefault();const b=e.submitter;if(b)b.disabled=true;try{await fn(Object.fromEntries(new FormData(e.target)))}catch(x){toast(x.message||'कुछ गड़बड़ हुई')}if(b)b.disabled=false}};
async function hash(s){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}
const nm=(c,id)=>{const x=db[c].find(x=>x.id==id);return x?(x.name||x.title):'—'};
const ord=(a,b)=>(a.display_order||0)-(b.display_order||0),st=r=>r.status=='active'?'चालू':'बंद';
let tab='dash',C={c:null,b:null},UQ='',MR=[];
function login(msg){A.innerHTML=`<div class="card lg"><h2>एडमिन लॉगिन</h2>${msg?`<p class="m">${E(msg)}</p>`:''}<form id="lf"><label>ईमेल<input name="email" type="email" required autocomplete="email"></label><label>पासवर्ड<input name="pw" type="password" required minlength="8" autocomplete="current-password"></label><button class="b big">लॉगिन</button><button type="button" class="b o big" onclick="adminSignup()">नया अकाउंट बनाएँ (पहली बार)</button></form></div>`;
 form('#lf',async d=>{const r=await sb.auth.signInWithPassword({email:d.email.trim().toLowerCase(),password:d.pw});if(r.error)throw Error('ईमेल या पासवर्ड गलत है');await gate()})}
async function adminSignup(){const f=$('#lf');if(!f.reportValidity())return;try{const r=await sb.auth.signUp({email:f.email.value.trim().toLowerCase(),password:f.pw.value,options:{data:{full_name:'Admin'}}});if(r.error)throw Error(r.error.message);
 if(r.data.user&&r.data.user.identities&&!r.data.user.identities.length)throw Error('यह ईमेल पहले से रजिस्टर है, लॉगिन करें');
 if(!r.data.session)return toast('अकाउंट बन गया। ईमेल में आया लिंक खोलकर कन्फ़र्म करें, फिर लॉगिन करें');await gate()}catch(x){toast(x.message)}}
async function gate(){const a=await sb.from('admins').select('user_id').maybeSingle();
 if(a.data){await loadAll();app();return}
 const h=await sb.rpc('has_admin');if(h.data===false){setup();return}
 await sb.auth.signOut();login('यह अकाउंट एडमिन नहीं है')}
function setup(){A.innerHTML=`<div class="card lg"><h2>पहली बार एडमिन सेटअप</h2><p class="m">अभी कोई एडमिन नहीं है। अपना सेटअप कोड डालकर इस अकाउंट को एडमिन बनाएँ।</p><form id="sf"><label>सेटअप कोड<input name="c" required autocomplete="off"></label><button class="b big">एडमिन बनाएँ</button><button type="button" class="b o big" onclick="sb.auth.signOut().then(()=>location.reload())">वापस</button></form></div>`;
 form('#sf',async d=>{const r=await sb.rpc('claim_admin',{p_code:d.c.trim()});if(r.error)throw Error('सेटअप कोड गलत है');await loadAll();app()})}
const TABS=[['dash','डैशबोर्ड'],['audio','ऑडियो'],['banner','लिसन नाउ'],['media','मीडिया लिंक'],['users','यूज़र'],['rep','रिपोर्ट'],['sett','सेटिंग'],['prev','ऐप प्रीव्यू']];
function app(){A.innerHTML=`<header><svg viewBox="0 0 24 24" fill="none" stroke="#0B6B7A" stroke-width="2" stroke-linecap="round"><path d="M4 16v-4a8 8 0 0116 0v4"/><rect x="3" y="14" width="4.5" height="7" rx="2"/><rect x="16.5" y="14" width="4.5" height="7" rx="2"/></svg><b>DeepEx एडमिन पैनल</b>${TABS.map(([k,n])=>`<button id="t_${k}" onclick="show('${k}')">${n}</button>`).join('')}<button onclick="sb.auth.signOut().then(()=>location.reload())">लॉगआउट</button></header><main id="v"></main>`;show(tab)}
async function show(t){tab=t;if(['dash','users','rep'].includes(t)){try{await loadAll()}catch(x){toast(x.message)}}document.querySelectorAll('header button[id]').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));({dash,audio,banner,media,users,rep,sett,prev}[t])()}
/* dashboard */
function dash(){const u=db.users,rb=[...db.books].slice(-5).reverse(),ru=[...u].slice(-5).reverse();
 $('#v').innerHTML=`<div class="g4">${[['कुल यूज़र',u.length],['ऑडियो बुक',db.books.length],['एपिसोड',db.eps.length],['एक्टिव बैनर',db.books.filter(b=>b.is_banner&&b.status=='active').length]].map(([n,v])=>`<div class="st"><h1>${v}</h1><p>${n}</p></div>`).join('')}</div>
 <div class="card"><h2>हाल में जुड़ी ऑडियो बुक</h2>${rb.map(b=>`<div class="r"><div><b>${E(b.title)}</b><br><small>${E(nm('cats',b.category_id))}</small></div></div>`).join('')||'<p class="m">अभी कुछ नहीं।</p>'}</div>
 <div class="card"><h2>नए यूज़र</h2>${ru.map(x=>`<div class="r"><div><b>${E(x.full_name)}</b><br><small>${E(x.email)} | ${x.created_at.slice(0,10)}</small></div></div>`).join('')||'<p class="m">अभी कोई यूज़र नहीं।</p>'}</div>`}
/* audio: category > audiobook > episodes */
const LBL={cats:'कैटेगरी',books:'ऑडियो बुक',eps:'एपिसोड'},NEW={cats:'नई कैटेगरी बनाएँ',books:'नई ऑडियो बुक जोड़ें',eps:'एपिसोड जोड़ें'},IMG={cats:'icon_url',books:'cover_image_url'};
const tg2=r=>`<div class="tg2"><label class="ck"><input type="checkbox" ${r.is_trending?'checked':''} onchange="setTr('${r.id}',this.checked)"> 🔥 ट्रेंडिंग ऑडियो में जोड़ें</label><label class="ck"><input type="checkbox" ${r.is_banner?'checked':''} onchange="setBn('${r.id}',this.checked)"> ▶ लिसन नाउ बैनर में जोड़ें</label>${r.is_banner?`<button class="b o sm" onclick="bnEdit('${r.id}')">पोर्ट्रेट इमेज बदलें</button>`:''}</div>`;
const thumb=(t,r)=>{const v=r[IMG[t]]||'';return /^http/.test(v)?`<img class="th" src="${E(v)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:v?`<span class="th">${E(v)}</span>`:''};
const list=(t,items,tt,sub,open)=>`<div class="card"><div class="hd"><h2>${LBL[t]}</h2><button class="b" onclick="edit('${t}')">+ ${NEW[t]}</button></div>${t=='eps'&&items.length?`<div class="hd"><button class="b o" onclick="lkAll(1)">🔒 सभी एपिसोड लॉक करें</button><button class="b o" onclick="lkAll(0)">🔓 सभी एपिसोड अनलॉक करें</button></div>`:''}${items.map(r=>`<div class="r">${thumb(t,r)}<div><b>${E(tt(r))}</b><br><small>${sub(r)}</small>${t=='books'?tg2(r):''}</div><div class="a">${open?`<button onclick="${open(r)}">खोलें</button>`:''}<button onclick="edit('${t}','${r.id}')">बदलें</button><button onclick="tgl('${t}','${r.id}')">${r.status=='active'?'बंद करें':'चालू करें'}</button>${t=='eps'?`<button onclick="lk('${r.id}')">${r.is_locked?'🔓 अनलॉक':'🔒 लॉक'}</button>`:''}<button class="x" onclick="del('${t}','${r.id}')">हटाएँ</button></div></div>`).join('')||'<p class="m">अभी कुछ नहीं जोड़ा गया।</p>'}</div>`;
function audio(){const sj=db.cats.find(x=>x.id==C.c);let h='';
 if(!sj){C.c=C.b=null;h=list('cats',[...db.cats].sort(ord),r=>r.name,r=>`${db.books.filter(b=>b.category_id==r.id).length} ऑडियो बुक | क्रम ${r.display_order} | ${st(r)}`,r=>`C.c='${r.id}';audio()`)}
 else{const BB=db.books.filter(b=>b.category_id==sj.id).sort(ord),bk=BB.find(x=>x.id==C.b);
  h=`<p class="bc"><a onclick="C.c=C.b=null;audio()">सभी कैटेगरी</a> / <a onclick="C.b=null;audio()">${E(sj.name)}</a>${bk?' / '+E(bk.title):''}</p>`;
  if(!bk){C.b=null;h+=list('books',BB,r=>r.title,r=>`${db.eps.filter(e=>e.audiobook_id==r.id).length} एपिसोड | क्रम ${r.display_order} | ${st(r)}${r.is_popular?' | पॉपुलर':''}`,r=>`C.b='${r.id}';audio()`)}
  else h+=list('eps',db.eps.filter(e=>e.audiobook_id==bk.id).sort((a,b)=>a.episode_number-b.episode_number),r=>`Episode ${r.episode_number}${r.title&&r.title!='Episode '+r.episode_number?': '+r.title:''}`,r=>`${Math.round((r.duration_seconds||0)/60)} मिनट | ${st(r)}${r.is_locked?' | 🔒 लॉक':''}<br><span style="word-break:break-all">${E(r.audio_url)}</span>`)}
 $('#v').innerHTML=h}
const YN=[['active','चालू'],['inactive','बंद']];
const F={cats:[{k:'name',l:'कैटेगरी का नाम'},{k:'description',l:'छोटा विवरण',t:'area',req:0},{k:'icon_url',l:'आइकन (इमोजी या IMGBB इमेज लिंक)',req:0},{k:'display_order',l:'क्रम (छोटा नंबर पहले)',t:'num'},{k:'status',l:'स्टेटस',t:'sel',o:YN}],
books:[{k:'title',l:'ऑडियो बुक का नाम'},{k:'short_description',l:'छोटा विवरण'},{k:'description',l:'पूरा विवरण',t:'area',req:0},{k:'cover_image_url',l:'कवर इमेज का लिंक (IMGBB) — ट्रेंडिंग में यही दिखेगी',t:'img',req:0,ph:'https://i.ibb.co/xxxx/cover.jpg'},{k:'display_order',l:'क्रम (छोटा नंबर पहले)',t:'num'},{k:'is_popular',l:'पॉपुलर ऑडियो बुक में दिखाएँ',t:'chk'},{k:'status',l:'स्टेटस',t:'sel',o:YN}],
eps:[{k:'episode_number',l:'Episode Number',t:'num'},{k:'title',l:'Episode Title (वैकल्पिक)',req:0},{k:'description',l:'Episode विवरण',t:'area',req:0},{k:'audio_url',l:'Audio URL (डायरेक्ट लिंक)',t:'aud',ph:'https://share.example.com/episode-01.mp3'},{k:'duration_min',l:'Duration (मिनट)',t:'num'},{k:'status',l:'स्टेटस',t:'sel',o:YN}]};
const fld=(f,r)=>{const v=r[f.k],rq=f.req===0?'':'required',l=`<label>${f.l}`;
 if(f.t=='sel')return`${l}<select name="${f.k}">${f.o.map(([a,b])=>`<option value="${a}" ${v==a?'selected':''}>${b}</option>`).join('')}</select></label>`;
 if(f.t=='area')return`${l}<textarea name="${f.k}" rows="3">${E(v)}</textarea></label>`;
 if(f.t=='img')return`${l}<input name="${f.k}" type="url" placeholder="${E(f.ph)}" value="${E(v)}" oninput="this.parentNode.nextElementSibling.src=this.value.trim()"></label><img class="pvw" alt="" referrerpolicy="no-referrer" ${v?`src="${E(v)}"`:'hidden'} onload="this.hidden=false" onerror="this.hidden=true">`;
 if(f.t=='aud')return`${l}<input name="${f.k}" type="url" required placeholder="${E(f.ph)}" value="${E(v)}" oninput="this.parentNode.nextElementSibling.src=this.value.trim()"></label><audio controls preload="none" ${v?`src="${E(v)}"`:''}></audio>`;
 if(f.t=='chk')return`<label class="ck"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
 return`${l}<input name="${f.k}" ${f.t=='num'?`type="number" min="0" step="1" value="${v??0}"`:`value="${E(v)}" ${rq}`}></label>`};
function chkImg(v){if(!v)return;if(!url(v))throw Error('इमेज लिंक https:// से शुरू होना चाहिए');if(/^https?:\/\/(www\.)?ibb\.co\//i.test(v))throw Error('यह IMGBB का पेज लिंक है। Direct link (i.ibb.co/...) कॉपी कीजिए')}
function edit(t,id){const r=id?db[t].find(x=>x.id==id):(t=='cats'?{display_order:db.cats.length+1,status:'active'}:t=='books'?{display_order:db.books.filter(b=>b.category_id==C.c).length+1,status:'active'}:{episode_number:Math.max(0,...db.eps.filter(e=>e.audiobook_id==C.b).map(e=>e.episode_number))+1,duration_min:0,status:'active'});
 if(t=='eps'&&id)r.duration_min=Math.round(r.duration_seconds/60);
 modal(`<form id="ef"><h2>${id?'बदलें':'नया जोड़ें'}: ${LBL[t]}</h2>${F[t].map(f=>fld(f,r)).join('')}<button class="b big">सेव करें</button><button type="button" class="b o big" onclick="closeM()">रद्द करें</button></form>`);
 form('#ef',async d=>{const o={};F[t].forEach(f=>{let v=d[f.k];if(f.t=='num')v=Math.max(0,+v||0);else if(f.t=='chk')v=d[f.k]=='on';else v=(v||'').trim();o[f.k]=v});
  chkImg(o.cover_image_url);if(t=='cats'&&o.icon_url&&/^http/i.test(o.icon_url))chkImg(o.icon_url);
  if(t=='books'){o.category_id=C.c}
  if(t=='eps'){if(!o.episode_number)throw Error('Episode Number डालिए');if(!url(o.audio_url))throw Error('Audio URL https:// से शुरू होना चाहिए');
   if(db.eps.some(e=>e.audiobook_id==C.b&&e.episode_number==o.episode_number&&e.id!=id))throw Error('इस ऑडियो बुक में यह Episode Number पहले से है');
   if(o.duration_min<=0)throw Error('Duration (मिनट) डालिए');o.title=o.title||'Episode '+o.episode_number;o.duration_seconds=Math.round(o.duration_min*60);delete o.duration_min;o.display_order=o.episode_number;o.audiobook_id=C.b}
  if(id){ck(await sb.from(TB[t]).update(o).eq('id',id));Object.assign(r,o)}else{const row={id:uid(),created_at:new Date().toISOString(),...o};ck(await sb.from(TB[t]).insert(row));db[t].push(row)}sv();closeM();toast('सेव हो गया')})}
async function lk(id){const r=db.eps.find(x=>x.id==id);if(!await mut(()=>sb.from('episodes').update({is_locked:!r.is_locked}).eq('id',id)))return;r.is_locked=!r.is_locked;sv();audio();toast(r.is_locked?'एपिसोड लॉक हो गया':'एपिसोड अनलॉक हो गया')}
async function lkAll(v){const l=db.eps.filter(e=>e.audiobook_id==C.b);if(!confirm((v?'इस ऑडियो बुक के सभी '+l.length+' एपिसोड लॉक करें?':'इस ऑडियो बुक के सभी '+l.length+' एपिसोड अनलॉक करें?')))return;if(!await mut(()=>sb.from('episodes').update({is_locked:!!v}).eq('audiobook_id',C.b)))return;l.forEach(e=>e.is_locked=!!v);sv();audio();toast(v?'सभी एपिसोड लॉक हो गए':'सभी एपिसोड अनलॉक हो गए')}
async function tgl(t,id){const r=db[t].find(x=>x.id==id),ns=r.status=='active'?'inactive':'active';if(!await mut(()=>sb.from(TB[t]).update({status:ns}).eq('id',id)))return;r.status=ns;sv();audio()}
async function del(t,id){if(t=='cats'){const n=db.books.filter(b=>b.category_id==id).length;if(n)return alert(`इस कैटेगरी में ${n} ऑडियो बुक हैं, इसलिए इसे हटाया नहीं जा सकता। पहले उन्हें हटाइए या दूसरी कैटेगरी में रखिए।`)}
 if(t=='books'){const n=db.eps.filter(e=>e.audiobook_id==id).length;if(!confirm(`यह ऑडियो बुक और इसके ${n} एपिसोड हट जाएँगे। पक्का?`))return}else if(!confirm('पक्का हटाना है?'))return;
 if(!await mut(()=>sb.from(TB[t]).delete().eq('id',id)))return;if(t=='books')db.eps=db.eps.filter(e=>e.audiobook_id!=id);db[t]=db[t].filter(x=>x.id!=id);sv();toast('हट गया');audio()}
/* trending / listen now */
const nextBn=()=>Math.max(0,...db.books.map(x=>x.banner_order||0))+1;
async function setTr(id,v){if(!await mut(()=>sb.from('audiobooks').update({is_trending:v}).eq('id',id))){show(tab);return}db.books.find(x=>x.id==id).is_trending=v;sv();toast(v?'ट्रेंडिंग ऑडियो में जुड़ गया':'ट्रेंडिंग से हट गया')}
async function setBn(id,v){const b=db.books.find(x=>x.id==id);if(v&&!b.banner_image_url)return bnEdit(id);const bo=(v&&!b.banner_order)?nextBn():(b.banner_order||0);if(!await mut(()=>sb.from('audiobooks').update({is_banner:v,banner_order:bo}).eq('id',id))){show(tab);return}b.is_banner=v;b.banner_order=bo;sv();toast(v?'लिसन नाउ बैनर में जुड़ गया':'बैनर से हट गया');show(tab)}
function bnEdit(id){const b=db.books.find(x=>x.id==id);
 modal(`<form id="bf"><h2>लिसन नाउ बैनर</h2><p class="m">${E(b.title)}<br>ImgBB से अलग <b>पोर्ट्रेट (3:4)</b> इमेज का Direct link डालिए। ऑडियो और एपिसोड ऑडियो बुक वाले ही रहेंगे, यहाँ बदले नहीं जा सकते।</p><label>पोर्ट्रेट इमेज का लिंक (IMGBB)<input name="u" type="url" required value="${E(b.banner_image_url||'')}" placeholder="https://i.ibb.co/xxxx/portrait.jpg" oninput="this.parentNode.nextElementSibling.src=this.value.trim()"></label><img class="pvw" style="width:150px;height:200px" alt="" referrerpolicy="no-referrer" ${b.banner_image_url?`src="${E(b.banner_image_url)}"`:'hidden'} onload="this.hidden=false" onerror="this.hidden=true"><button class="b big">सेव करें और बैनर में जोड़ें</button><button type="button" class="b o big" onclick="closeM()">रद्द करें</button></form>`);
 form('#bf',async d=>{const v=d.u.trim();chkImg(v);const bo=b.banner_order||nextBn();ck(await sb.from('audiobooks').update({banner_image_url:v,is_banner:true,banner_order:bo}).eq('id',id));b.banner_image_url=v;b.is_banner=true;b.banner_order=bo;sv();closeM();toast('लिसन नाउ बैनर में जुड़ गया')})}
function banner(){const l=db.books.filter(b=>b.is_banner).sort((a,b)=>(a.banner_order||0)-(b.banner_order||0));
 $('#v').innerHTML=`<div class="card"><h2>लिसन नाउ बैनर (टॉप स्क्रॉल)</h2><p class="m">यहाँ अलग से कुछ नहीं जोड़ा जाता। <a class="l" onclick="show('audio')">ऑडियो</a> में किसी भी ऑडियो बुक के नीचे “लिसन नाउ बैनर में जोड़ें” चुनिए।</p>${l.map((b,i)=>`<div class="r"><img class="th" style="width:60px;height:80px" src="${E(b.banner_image_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()"><div><b>${E(b.title)}</b><br><small>क्रम ${i+1} | ${st(b)}</small></div><div class="a"><button onclick="mvB('${b.id}',-1)">↑</button><button onclick="mvB('${b.id}',1)">↓</button><button onclick="bnEdit('${b.id}')">इमेज बदलें</button><button class="x" onclick="setBn('${b.id}',false)">हटाएँ</button></div></div>`).join('')||'<p class="m">अभी कोई बैनर नहीं।</p>'}</div>`}
async function mvB(id,d){const l=db.books.filter(b=>b.is_banner).sort((a,b)=>(a.banner_order||0)-(b.banner_order||0));l.forEach((b,i)=>b.banner_order=i+1);const i=l.findIndex(b=>b.id==id),j=i+d;if(j<0||j>=l.length)return;[l[i].banner_order,l[j].banner_order]=[l[j].banner_order,l[i].banner_order];if(!await mut(()=>Promise.all(l.map(b=>sb.from('audiobooks').update({banner_order:b.banner_order}).eq('id',b.id))).then(rs=>({error:(rs.find(r=>r.error)||{}).error}))))return;sv();banner()}
/* media links */
function media(){MR=[...db.books.filter(b=>b.cover_image_url).map(b=>['कवर इमेज',b.title,'',b.cover_image_url,'books',b.id,'cover_image_url','i']),...db.books.filter(b=>b.banner_image_url).map(b=>['बैनर (पोर्ट्रेट)',b.title,'',b.banner_image_url,'books',b.id,'banner_image_url','i']),...db.eps.map(e=>['ऑडियो',nm('books',e.audiobook_id),'Episode '+e.episode_number,e.audio_url,'eps',e.id,'audio_url','a'])];
 $('#v').innerHTML=`<div class="card"><h2>मीडिया लिंक</h2>${MR.map((r,i)=>`<div class="r"><div><b>${r[0]}</b> · ${E(r[1])} ${r[2]}<br><small style="word-break:break-all">${E(r[3])}</small></div><div class="a"><button onclick="mu(${i})">बदलें</button><button onclick="vu(this,${i})">जाँचें</button></div></div>`).join('')||'<p class="m">अभी कोई लिंक नहीं।</p>'}</div>`}
async function mu(i){const r=MR[i],n=prompt('नया लिंक',r[3]);if(n===null)return;if(!url(n.trim()))return toast('लिंक सही नहीं है');if(!await mut(()=>sb.from(TB[r[4]]).update({[r[6]]:n.trim()}).eq('id',r[5])))return;db[r[4]].find(x=>x.id==r[5])[r[6]]=n.trim();sv();media()}
function vu(b,i){const r=MR[i];b.textContent='…';const ok=()=>b.textContent='✔ ठीक है',bad=()=>b.textContent='✖ खराब लिंक';const el=r[7]=='a'?new Audio():new Image();if(r[7]=='a'){el.preload='metadata';el.onloadedmetadata=ok;el.onerror=bad}else{el.onload=ok;el.onerror=bad}el.src=r[3]}
/* users */
function users(){$('#v').innerHTML=`<div class="card"><h2>यूज़र</h2><input placeholder="नाम या ईमेल से खोजिए" value="${E(UQ)}" oninput="UQ=this.value;ul()"><div id="ul"></div></div>`;ul()}
function ul(){const q=UQ.toLowerCase(),l=db.users.filter(x=>(x.full_name+x.email).toLowerCase().includes(q));
 $('#ul').innerHTML=l.map(x=>`<div class="r"><div><b>${E(x.full_name)}</b><br><small>${E(x.email)} | ${x.created_at.slice(0,10)} | Free | ${st(x)}</small></div><div class="a"><button onclick="udet('${x.id}')">विवरण</button><button onclick="ust('${x.id}')">${x.status=='active'?'बंद करें':'चालू करें'}</button></div></div>`).join('')||'<p class="m">कोई यूज़र नहीं मिला।</p>'}
async function ust(id){const x=db.users.find(u=>u.id==id),ns=x.status=='active'?'inactive':'active';if(!await mut(()=>sb.from('profiles').update({status:ns}).eq('id',id)))return;x.status=ns;sv();ul()}
function udet(id){const x=db.users.find(u=>u.id==id),d=db.ud[x.email]||{fav:[],pl:[],hist:[]};
 modal(`<form id="uf"><h2>${E(x.full_name)}</h2><p class="m">${E(x.email)}</p><label>नाम<input name="n" required value="${E(x.full_name)}"></label><button class="b big">नाम सेव करें</button>
 <p><b>पसंदीदा (${d.fav.length}):</b> ${d.fav.map(f=>E(nm(f[0]=='b'?'books':'eps',f.slice(1)))).join(', ')||'—'}</p><p><b>प्लेलिस्ट (${d.pl.length}):</b> ${d.pl.map(p=>E(p.name)+' ('+p.items.length+')').join(', ')||'—'}</p><p><b>सुनने का इतिहास:</b><br>${d.hist.map(h=>E(nm('books',h.b))+' / '+E(nm('eps',h.e))+' | '+h.p+' सेकंड').join('<br>')||'—'}</p><button type="button" class="b o big" onclick="closeM()">बंद करें</button></form>`);
 form('#uf',async f=>{const nn=f.n.trim()||x.full_name;ck(await sb.from('profiles').update({full_name:nn}).eq('id',x.id));x.full_name=nn;sv();closeM();toast('सेव हो गया')})}
/* reports */
function rep(){const pl=Object.entries(db.plays).sort((a,b)=>b[1]-a[1]),bp={},fav={};
 pl.forEach(([e,n])=>{const ep=db.eps.find(x=>x.id==e);if(ep)bp[ep.audiobook_id]=(bp[ep.audiobook_id]||0)+n});
 Object.values(db.ud).forEach(d=>d.fav.forEach(f=>fav[f]=(fav[f]||0)+1));
 const U=Object.values(db.ud),L=(a,t)=>`<div class="card"><h2>${t}</h2>${a.map(([n,v])=>`<div class="r"><div>${E(n)}</div><b>${v}</b></div>`).join('')||'<p class="m">अभी डेटा नहीं है।</p>'}</div>`;
 $('#v').innerHTML=`<div class="g4">${[['रजिस्टर्ड यूज़र',db.users.length],['सक्रिय यूज़र (सुना है)',U.filter(d=>d.hist.length).length],['ऑडियो बुक',db.books.length],['एपिसोड',db.eps.length],['सुनने के सत्र',U.reduce((a,d)=>a+d.hist.length,0)]].map(([n,v])=>`<div class="st"><h1>${v}</h1><p>${n}</p></div>`).join('')}</div>`
 +L(Object.entries(bp).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([i,n])=>[nm('books',i),n]),'सबसे ज़्यादा चली ऑडियो बुक')+L(pl.slice(0,5).map(([i,n])=>[nm('eps',i),n]),'सबसे ज़्यादा चले एपिसोड')+L(Object.entries(fav).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>[nm(k[0]=='b'?'books':'eps',k.slice(1)),n]),'पसंदीदा आँकड़े')}
/* settings */
function sett(){$('#v').innerHTML=`<div class="card"><h2>एडमिन प्रोफ़ाइल</h2><p>ईमेल: <b>${E(db.cfg.admin.email)}</b></p><form id="pf"><label>नया पासवर्ड (कम से कम 8 अक्षर)<input name="p" type="password" minlength="8" required autocomplete="new-password"></label><button class="b big">पासवर्ड बदलें</button></form></div>
 <div class="card"><h2>ऐप कॉन्फ़िगरेशन</h2><form id="cf"><label>डिफ़ॉल्ट भाषा<select name="l"><option value="en" ${db.cfg.lang=='en'?'selected':''}>English</option><option value="hi" ${db.cfg.lang=='hi'?'selected':''}>हिन्दी</option></select></label><label>डिफ़ॉल्ट थीम<select name="t"><option value="dark" ${db.cfg.theme!='light'?'selected':''}>डार्क</option><option value="light" ${db.cfg.theme=='light'?'selected':''}>लाइट</option></select></label><button class="b big">सेव करें</button></form></div>`;
 $('#v').insertAdjacentHTML('beforeend',IMPORT_CARD);form('#pf',async d=>{ck(await sb.auth.updateUser({password:d.p}));toast('पासवर्ड बदल गया')});form('#cf',async d=>{ck(await sb.from('app_config').upsert([{key:'lang',value:d.l},{key:'theme',value:d.t}]));db.cfg.lang=d.l;db.cfg.theme=d.t;sv();toast('सेव हो गया')})}
function prev(){$('#v').innerHTML=`<div class="card" style="text-align:center"><h2>ऐप प्रीव्यू</h2><iframe src="index.html" style="width:390px;max-width:100%;height:740px;border:6px solid var(--d);border-radius:30px;background:#000;margin-top:10px"></iframe></div>`}
const IMPORT_CARD=`<div class="card"><h2>पुराना डेटा Supabase में अपलोड करें</h2><p class="m">अगर इस ब्राउज़र में पहले का लोकल डेटा (श्रेणियाँ, ऑडियो बुक, एपिसोड) है, तो उसे एक बार Supabase में डाल दें। यूज़र अकाउंट अपलोड नहीं होते — यूज़र ऐप में नया रजिस्टर करेंगे।</p><button class="b big" onclick="importLocal()">लोकल डेटा अपलोड करें</button></div>`;
async function importLocal(){const raw=localStorage.dx_db;if(!raw)return toast('इस ब्राउज़र में पुराना डेटा नहीं मिला');let o;try{o=JSON.parse(raw)}catch(x){return toast('पुराना डेटा पढ़ नहीं सके')}
 const C=o.cats||[],B=o.books||[],P=o.eps||[];if(!C.length&&!B.length&&!P.length)return toast('अपलोड करने लायक डेटा नहीं मिला');
 if(!confirm('अपलोड करें?\nश्रेणियाँ: '+C.length+', ऑडियो बुक: '+B.length+', एपिसोड: '+P.length))return;
 const pk=(r,ks)=>Object.fromEntries(ks.filter(k=>r[k]!==undefined&&r[k]!==null).map(k=>[k,r[k]]));
 try{if(C.length)ck(await sb.from('categories').upsert(C.map(r=>pk(r,['id','name','description','icon_url','display_order','status','created_at']))));
  if(B.length)ck(await sb.from('audiobooks').upsert(B.map(r=>pk(r,['id','category_id','title','short_description','description','cover_image_url','banner_image_url','is_trending','is_popular','is_banner','banner_order','display_order','status','created_at']))));
  if(P.length)ck(await sb.from('episodes').upsert(P.map(r=>pk(r,['id','audiobook_id','episode_number','title','description','audio_url','duration_seconds','display_order','is_locked','status','created_at']))));
  await loadAll();show(tab);toast('अपलोड हो गया')}catch(x){toast('अपलोड नहीं हुआ: '+x.message)}}
(async()=>{try{const g=await sb.auth.getSession();if(g.data.session)await gate();else login()}catch(x){login()}})();
</script></body></html>
